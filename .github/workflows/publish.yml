name: Publish to npm

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Determine whether the version needs publishing
        id: release
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/release-plan.mjs
      - name: Install npm with trusted publishing support
        if: steps.release.outputs.publish == 'true'
        run: npm install --global npm@11.19.1
      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: npm ci
      - name: Type check
        if: steps.release.outputs.publish == 'true'
        run: npm run check
      - name: Build and test
        if: steps.release.outputs.publish == 'true'
        run: npm test
      - name: Publish through npm trusted publishing
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: npm publish --access public --provenance --tag "$RELEASE_TAG"
